{# Reusable availability modal – click to select/deselect multiple days #}
<div class="modal fade" id="calendarModal" tabindex="-1" aria-labelledby="calendarModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="calendarModalLabel">Tool Availability</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <div id="calendar"></div>

        <!-- Legend -->
        <div class="mt-3 d-flex align-items-center gap-3">
          <div><span class="legend-box" style="background-color:#14532d;"></span> <span>Available</span></div>
          <div><span class="legend-box" style="background-color:#fca5a5;"></span> <span>Unavailable</span></div>
          <div><span class="legend-box" style="background-color:#cfe2ff;"></span> <span>Selected</span></div>
        </div>

        <hr class="my-3">

        <!-- Multi-day add-to-cart -->
        <form id="addDatesForm" method="POST" action="{{ url_for('add_to_cart_dates') }}">
          <input type="hidden" name="tool_id" id="selected_tool_id">
          <div id="selected_dates_inputs"></div>
          <div class="d-flex align-items-center gap-2 mt-2 flex-wrap">
            <span id="selected_date_display" class="text-muted">Click days to select them.</span>
            <div class="ms-auto d-flex gap-2">
              <button type="button" id="clear_selection_btn" class="btn btn-outline-secondary btn-sm">
                Clear selection
              </button>
              <button type="submit" id="add_to_cart_btn" class="btn btn-primary btn-sm" disabled>
                Add Selected Dates
              </button>
            </div>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<style>
  .legend-box { display:inline-block; width:18px; height:18px; margin-right:6px; border:1px solid #000; vertical-align:middle; }
  /* Style the actual day grid cells we toggle classes on */
  .fc-daygrid-day.available   { background-color:#14532d !important; color:#fff !important; }
  .fc-daygrid-day.unavailable { background-color:#fca5a5 !important; color:#000 !important; }
  .fc-daygrid-day.available:hover   { background-color:#166534 !important; }
  .fc-daygrid-day.unavailable:hover { background-color:#f87171 !important; }
  .fc-daygrid-day.selected    { outline:3px solid #84b9ff; background-color:#cfe2ff !important; color:#084298 !important; }
</style>

<script>
  let calendar;
  let availableDates = new Set();  // yyyy-mm-dd strings marked Available by the API
  let selectedDates  = new Set();  // current multi-selection

  // Called from search page: onclick="loadAvailability(toolId, toolName)"
  function loadAvailability(toolId, toolName) {
    fetch(`/api/tool_availability/${toolId}`)
      .then(r => r.json())
      .then(data => {
        document.getElementById('calendarModalLabel').innerText = `${toolName} Availability`;

        // Reset form state
        document.getElementById('selected_tool_id').value = toolId;
        document.getElementById('selected_dates_inputs').innerHTML = '';
        document.getElementById('selected_date_display').innerText = 'Click days to select them.';
        document.getElementById('add_to_cart_btn').disabled = true;

        // Build availability set (API returns one event per day)
        availableDates = new Set();
        (data.events || []).forEach(ev => {
          if (ev && ev.title === 'Available' && ev.start) {
            availableDates.add(ev.start.slice(0,10));
          }
        });
        selectedDates = new Set();

        // Show modal and render calendar after shown (ensures proper sizing)
        const modalEl = document.getElementById('calendarModal');
        const calendarEl = document.getElementById('calendar');
        const modal = new bootstrap.Modal(modalEl);
        modal.show();

        modalEl.addEventListener('shown.bs.modal', function () {
          if (calendar) calendar.destroy();

          calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            height: 500,

            dayCellDidMount: function(arg) {
              const ymd = arg.date.toISOString().slice(0,10);
              arg.el.classList.add(availableDates.has(ymd) ? 'available' : 'unavailable');
              if (selectedDates.has(ymd)) arg.el.classList.add('selected');
            },

            dateClick: function(info) {
              // Prevent default <a> click behavior (esp. on day number)
              if (info.jsEvent) {
                info.jsEvent.preventDefault();
                info.jsEvent.stopPropagation();
              }

              const ymd = info.dateStr;
              if (!availableDates.has(ymd)) return; // can't select unavailable day

              // Toggle this day's selection (no clearing of others)
              const cell = info.dayEl && info.dayEl.closest
                ? info.dayEl.closest('.fc-daygrid-day')
                : info.dayEl;

              if (selectedDates.has(ymd)) {
                selectedDates.delete(ymd);
                if (cell) cell.classList.remove('selected');
              } else {
                selectedDates.add(ymd);
                if (cell) cell.classList.add('selected');
              }

              rebuildSelectedInputs();
            }
          });

          calendar.render();
        }, { once: true });
      })
      .catch(() => {
        const modalEl = document.getElementById('calendarModal');
        const calendarEl = document.getElementById('calendar');
        calendarEl.innerHTML = '<div class="text-danger">Failed to load availability.</div>';
        const modal = new bootstrap.Modal(modalEl);
        modal.show();
      });
  }

  function rebuildSelectedInputs() {
    const holder = document.getElementById('selected_dates_inputs');
    holder.innerHTML = '';

    const sorted = Array.from(selectedDates).sort();
    sorted.forEach(d => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'selected_dates';
      input.value = d;
      holder.appendChild(input);
    });

    const disp = document.getElementById('selected_date_display');
    const btn  = document.getElementById('add_to_cart_btn');

    if (sorted.length === 0) {
      disp.innerText = 'No dates selected';
      btn.disabled = true;
    } else if (sorted.length === 1) {
      disp.innerText = `Selected: ${sorted[0]} (click more days to add)`;
      btn.disabled = false;
    } else {
      disp.innerText = `Selected: ${sorted[0]} … ${sorted[sorted.length - 1]} (+${sorted.length - 2} more)`;
      btn.disabled = false;
    }
  }

  // NEW: Clear selection button
  document.addEventListener('DOMContentLoaded', function () {
    const form  = document.getElementById('addDatesForm');
    const clear = document.getElementById('clear_selection_btn');

    if (clear) {
      clear.addEventListener('click', function () {
        selectedDates.clear();
        document.getElementById('selected_dates_inputs').innerHTML = '';
        document.getElementById('selected_date_display').innerText = 'Click days to select them.';
        document.getElementById('add_to_cart_btn').disabled = true;
        // remove highlight from all day cells
        document.querySelectorAll('.fc-daygrid-day.selected')
          .forEach(d => d.classList.remove('selected'));
      });
    }

    if (form) {
      form.addEventListener('submit', function (e) {
        if (!selectedDates || selectedDates.size === 0) {
          e.preventDefault();
        }
      });
    }
  });
</script>
