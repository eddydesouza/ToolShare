{% extends "base.html" %}
{% block title %}Sign Up | ToolShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-9">
    <h2 class="mb-4 text-center">Sign Up</h2>
    <form method="POST" class="row g-3">
      <div class="col-md-6">
        <label for="inputFirstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="inputFirstName" placeholder="First Name" name="first_name" required>
      </div>
      <div class="col-md-6">
        <label for="inputLastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="inputLastName" placeholder="Last Name" name="last_name" required>
      </div>
      <div class="col-md-6">
        <label for="inputEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="inputEmail" placeholder="ex. myemail@gmail.com" name="email" required>
      </div>
      <div class="col-md-6">
        <label for="inputPhone" class="form-label">Phone</label>
        <input type="text" class="form-control" id="inputPhone" placeholder="ex. 456-123-9876" name="phone" required>
      </div>
      <div class="mb-3">
        <label for="inputAddress" class="form-label">Address</label>
        <input type="text" class="form-control" id="inputEmail" placeholder="ex. 123 Main St Apt 10" name="address_line1">
      </div>
      <div class="col-md-6">
        <label for="inputCity" class="form-label">City</label>
        <input type="text" class="form-control" id="inputCity" placeholder="ex. Springfield" name="city">
      </div>
      <div class="col-md-2">
        <label for="inputState" class="form-label">State</label>
        <input type="text" class="form-control" id="inputState" placeholder="ex. MA" name="state">
      </div>
      <div class="col-md-4">
        <label for="inputZipCode" class="form-label">Zip Code</label>
        <input type="text" class="form-control" id="inputZipCode" placeholder="ex. 01234" name="zip_code">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <div class="col-md-4">
        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
      </div>
    </form>
      <div class="row">
        <div class="mt-4 col-md-6"></div>
        <div class="mt-4 col-md-6 card">
          <p class="mt-3 text-center">
            Already have an account? <a href="{{ url_for('login') }}">Login</a>
          </p>
        </div>
      </div>
  </div>
</div>
{% endblock %}
